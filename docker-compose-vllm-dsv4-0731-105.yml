services:
  # ===== DeepSeek-V4-Flash-0731-W8A8 (16卡, tp8 dp2, DSpark W8A8) =====
  # 引擎: MACA 3.8.2.105 + vLLM 0.25.0 (torch2.10/py312)
  vllm-dsv4-0731-w8a8:
    image: cr.metax-tech.com/public-ai-release/maca/modelzoo.llm.vllm:1.0.3-maca.ai3.8.2.105-torch2.10-py312-ubuntu22.04-amd64
    container_name: vllm-dsv4-0731-w8a8-105
    working_dir: /workspace
    privileged: true
    network_mode: "host"
    ipc: "host"
    shm_size: "100gb"
    tty: true
    command: bash /workspace/start_vllm_deepseek_v4_0731_w8a8_105.sh
    environment:
      - PATH=/opt/conda/bin:/opt/maca/bin:/opt/maca/mxgpu_llvm/bin:/opt/maca/ompi/bin:/opt/maca/ucx/bin:/opt/mxdriver/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - LD_LIBRARY_PATH=/opt/maca/mxshmem/lib:/opt/maca/lib:/opt/maca/ompi/lib:/opt/maca/ucx/lib:/opt/mxdriver/lib
      - MACA_PATH=/opt/maca
      - MACA_CLANG_PATH=/opt/maca/mxgpu_llvm/bin
      - CUCC_PATH=/opt/maca/tools/cu-bridge
      - CUDA_PATH=/opt/maca/tools/cu-bridge
      - TZ=Asia/Shanghai
      - TORCH_ALLOW_TF32_CUBLAS_OVERRIDE=1
      - DEBIAN_FRONTEND=noninteractive
    volumes:
      - /home/workspace:/workspace
      - /mnt/model:/data/model
      - /home/models_log:/home/models_log
    devices:
      - /dev/dri:/dev/dri
      - /dev/mxcd:/dev/mxcd
      - /dev/infiniband:/dev/infiniband
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      memlock: { soft: -1, hard: -1 }
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"